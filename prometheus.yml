global:
  scrape_interval: 120s
  evaluation_interval: 120s
  external_labels:
    monitor: 'my-project'

# rule_files:
#   - "alert.rules"
#   - "first.rules"
#   - "second.rules"

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 120s
    static_configs:
      - targets:
          - 'localhost:9090'
          - 'cadvisor:8080'
          - 'node-exporter:9100'
          - 'nginx-exporter:9113'

  - job_name: 'jenkins'
    scrape_interval: 120s
    metrics_path: /prometheus
    static_configs:
      - targets:
          - 'jenkins:8080'
